<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Свадебное приглашение</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;
    background:linear-gradient(to bottom,#fff,#f5e6c8);
    color:#333;
}

.container{
    padding:60px 20px;
    animation:fade 2s;
}

h1{
    font-size:42px;
}

.date{
    font-size:24px;
    margin:20px 0;
}

.timer{
    font-size:28px;
    margin:25px 0;
    font-weight:bold;
}

.photo{
    width:280px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.button{
    display:inline-block;
    margin-top:30px;
    padding:15px 30px;
    background:gold;
    border-radius:15px;
    text-decoration:none;
    color:black;
    font-size:20px;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(50px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>

<div class="container">
    <h1>Али ❤️ Амина</h1>
    <p>С любовью приглашаем вас на нашу свадьбу 💍</p>

    <img class="photo" src="https://picsum.photos/300/400" alt="Фото">

    <div class="date">
        📅 25 августа 2026
    </div>
