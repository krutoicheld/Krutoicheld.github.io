<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тойға шақыру</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f8f3ea;
text-align:center;
color:#5a4320;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)),
url('https://images.unsplash.com/photo-1519225421980-715cb0215aed?w=1200');
background-size:cover;
background-position:center;
}

h1{
font-size:55px;
color:#b58a3a;
}

.subtitle{
font-size:24px;
max-width:330px;
line-height:1.5;
}

.button{
display:inline-block;
margin-top:25px;
padding:15px 35px;
background:#b58a3a;
color:white;
text-decoration:none;
border-radius:40px;
font-size:22px;
}

.section{
padding:80px 20px;
}

.card{
background:white;
padding:30px;
border-radius:30px;
max-width:350px;
margin:auto;
box-shadow:0 5px 25px rgba(0,0,0,.1);
}

.timer{
font-size:28px;
margin-top:20px;
color:#b58a3a;
font-weight:bold;
}

.photo{
width:90%;
max-width:350px;
border-radius:25px;
margin-top:25px;
}

.music{
position:fixed;
top:20px;
right:20px;
border:none;
background:#b58a3a;
color:white;
padding:12px 18px;
border-radius:30px;
font-size:18px;
}
</style>
</head>

<body>

<button class="music" onclick="toggleMusic()">🎵 Музыка</button>

<section class="hero">
<h1>Ахмад & Амина</h1>
<p class="subtitle">
Сіздерді біздің қуанышымызға ортақ болуға шақырамыз ✨
</p>

<a href="#invite" class="button">
Шақыруды ашу
</a>
</section>

<section class="section" id="invite">

<div class="card">
<h2>Той уақыты</h2>

<div id="timer" class="timer"></div>

<p>
📅 25 Тамыз 2026<br>
🕐 18:00<br>
📍 Алматы
</p>
</div>

<img class="photo"
src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=1200">

</section>

<audio id="music" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
</audio>

<script>
const weddingDate = new Date("2026-08-25 18:00:00");

function updateTimer(){
const now = new Date();
const diff = weddingDate - now;

const days = Math.floor(diff/(1000*60*60*24));
const hours = Math.floor((diff/(1000*60*60))%24);

document.getElementById("timer").innerHTML =
days + " күн " + hours + " сағат";
}

updateTimer();
setInterval(updateTimer,1000);

function toggleMusic(){
const music=document.getElementById("music");

if(music.paused){
music.play();
}else{
music.pause();
}
}
</script>

</body>
</html>
